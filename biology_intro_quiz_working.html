ة في المخلوق الحي؟',a:['العضو','الجهاز','الخلية','النسيج'],c:2,e:'الخلية هي الوحدة الأساسية لبناء المخلوقات الحية ووظائفها.'},{q:'أي مما يأتي يمثل استجابة لمؤثر خارجي؟',a:['اتجاه النبات نحو الضوء','تكوّن الصخور','تبخر الماء','صدأ الحديد'],c:0,e:'اتجاه النبات نحو الضوء مثال على الاستجابة للمؤثرات.'},{q:'لماذا يستخدم علماء الأحياء الملاحظات والبيانات؟',a:['لتجنب اختبار الأفكار','لدعم التفسيرات العلمية','لاستبدال الأدلة بالتخمين','لإلغاء التجارب'],c:1,e:'تُستخدم الملاحظات والبيانات للوصول إلى تفسيرات علمية تستند إلى الأدلة.'},{q:'ما المقصود بالاتزان الداخلي؟',a:['توقف جميع وظائف الجسم','المحافظة على ظروف داخلية مناسبة','زيادة حجم المخلوق باستمرار','عدم التفاعل مع البيئة'],c:1,e:'الاتزان الداخلي هو تنظيم الظروف الداخلية والمحافظة على استقرارها النسبي.'}];let i=0,points=0,answered=false;const el=id=>document.getElementById(id);function show(id){['intro','quiz','result'].forEach(x=>el(x).classList.toggle('hide',x!==id))}function start(){i=0;points=0;show('quiz');render()}function render(){answered=false;const q=questions[i];el('counter').textContent=`السؤال ${i+1} من ${questions.length}`;el('points').textContent=`${points} إجابات صحيحة`;el('bar').style.width=`${i/questions.length*100}%`;el('question').textContent=q.q;el('feedback').classList.add('hide');el('next').classList.add('hide');el('next').textContent=i===questions.length-1?'عرض النتيجة ←':'السؤال التالي ←';el('answers').innerHTML='';q.a.forEach((a,n)=>{const b=document.createElement('button');b.className='answer';b.textContent=`${['أ','ب','ج','د'][n]}. ${a}`;b.onclick=()=>choose(n);el('answers').append(b)})}function choose(n){if(answered)return;answered=true;const q=questions[i],ok=n===q.c;if(ok)points++;[...el('answers').children].forEach((b,j)=>{b.disabled=true;if(j===q.c)b.classList.add('correct');else if(j===n)b.classList.add('wrong')});el('feedback').textContent=(ok?'إجابة صحيحة. ':'الإجابة الصحيحة: '+q.a[q.c]+'. ')+q.e;el('feedback').classList.remove('hide');el('points').textContent=`${points} إجابات صحيحة`;el('bar').style.width=`${(i+1)/questions.length*100}%`;el('next').classList.remove('hide')}function advance(){i++;if(i<questions.length)render();else{show('result');el('score').textContent=`${points} / ${questions.length}`;el('summary').textContent=points===questions.length?'أحسنتِ! جميع إجاباتك صحيحة.':'يمكنك مراجعة المفاهيم ثم إعادة المحاولة لتحسين نتيجتك.'}}document.getElementById('startButton').addEventListener('click',start);document.getElementById('next').addEventListener('click',advance);document.getElementById('restartButton').addEventListener('click',start);</script></body></html>
